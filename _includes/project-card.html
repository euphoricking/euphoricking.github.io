<article class="project-card">
  {% if include.project.image %}
  <a href="{{ include.project.url | relative_url }}">
    <img src="{{ include.project.image | relative_url }}" alt="{{ include.project.title }}">
  </a>
  {% endif %}
  <div class="project-card-body">
    <p class="project-category">{{ include.project.category }}</p>
    <h3><a href="{{ include.project.url | relative_url }}">{{ include.project.title }}</a></h3>
    <p>{{ include.project.summary }}</p>
    {% if include.project.tools %}
    <div class="tag-row small">
      {% for tool in include.project.tools limit:5 %}
      <span class="tag">{{ tool }}</span>
      {% endfor %}
    </div>
    {% endif %}
    <a class="text-link" href="{{ include.project.url | relative_url }}">Read case study →</a>
  </div>
</article>
